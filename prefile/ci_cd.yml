# .github/workflows/ci_cd.yml
# CI/CD 流程：代码检查 → Docker 构建 → 推送 GCR → 可选触发训练

name: CI / CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/floorplan-trainer

jobs:
  # ──────────────────────────────────────────
  # Job 1: 代码质量检查
  # ──────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lint tools
        run: pip install flake8 pyflakes

      - name: Flake8
        run: |
          flake8 config.py utils.py model_arch.py train_engine.py predict.py preprocess_runner.py \
            --max-line-length=120 --ignore=E203,W503

  # ──────────────────────────────────────────
  # Job 2: 单元测试（CPU 模式）
  # ──────────────────────────────────────────
  test:
    name: Unit Tests (CPU)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (CPU only)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python-headless Pillow numpy

      - name: Smoke test model_arch
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, '.')
          # 用 dummy config 测试模型可以初始化 + 前向传播
          from dataclasses import dataclass, field
          from typing import Tuple, List
          @dataclass
          class DummyCfg:
              pretrained_backbone: bool = False
              fpn_out_channels: int = 256
              seg_num_classes: int = 2
              det_num_classes: int = 3
              wall_class_weight: float = 5.0
              affinity_neighborhood: int = 5
          import torch
          from model_arch import FloorplanModel, SegmentationLoss
          cfg   = DummyCfg()
          model = FloorplanModel(cfg)
          model.eval()
          dummy = torch.zeros(1, 3, 128, 128)
          with torch.no_grad():
              out = model(dummy)
          assert 'seg_logits' in out
          assert out['seg_logits'].shape == (1, 2, 128, 128)
          print('✓ model_arch smoke test passed')
          EOF

  # ──────────────────────────────────────────
  # Job 3: 构建 Docker 镜像并推送 GCR
  # 仅在 push 到 main 时执行
  # ──────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag $IMAGE_NAME:${{ github.sha }} \
            --tag $IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Output image digest
        run: |
          echo "Pushed: $IMAGE_NAME:${{ github.sha }}"
